<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0f14"><title>Proyecto Octágono Alpha 0.1</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#0b0f14;--text:#f5f7fb;--muted:#a9b4c4;--gold:#f3b634}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 12%,#28313d,#131922 36%,#0b0f14 72%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}body{min-height:100dvh}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 7px}.logo{font-size:11px;letter-spacing:.17em;color:var(--muted);font-weight:800}.badge{font-size:12px;font-weight:900;padding:7px 10px;border:1px solid #ffffff18;border-radius:99px;background:#ffffff0d}.hud{display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center}.hud.enemy{grid-template-columns:1fr 46px}.avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#303a47,#171d25);border:1px solid #ffffff18}.name{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px}.bar{height:9px;border-radius:99px;background:#07090d;overflow:hidden}.fill{height:100%;width:100%;transition:width .28s}.enemy .fill{background:linear-gradient(90deg,#a52236,#ff6262)}.player .fill{background:linear-gradient(90deg,#159a67,#51eaa6)}.energy{height:5px;margin-top:4px}.energy .fill{background:linear-gradient(90deg,#c98711,#ffe277)}.intent{margin:8px 0 1px;padding:8px 10px;border-radius:15px;background:#111722d9;border:1px solid #ffffff12;text-align:center;font-size:12px}.intent strong{color:var(--gold)}.arena-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.arena{position:relative;width:min(94vw,470px);aspect-ratio:1;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:linear-gradient(145deg,#c6ccd4,#616b78 44%,#2a323c);filter:drop-shadow(0 22px 38px #000b)}.arena:before{content:"";position:absolute;inset:6px;clip-path:inherit;background:repeating-linear-gradient(90deg,#ffffff10 0 1px,transparent 1px 26px),repeating-linear-gradient(0deg,#ffffff10 0 1px,transparent 1px 26px),radial-gradient(circle at 50% 45%,#3d4855,#202832 68%,#11161c)}.grid{position:absolute;inset:14%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:7px;touch-action:none;user-select:none;z-index:4}.tile{position:relative;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#3a4553,#202731);border:1px solid #ffffff18;box-shadow:inset 0 1px #ffffff17,0 8px 14px #0006;transition:.1s;font-size:clamp(20px,6vw,31px)}.tile small{position:absolute;right:4px;bottom:3px;font-size:7px;font-weight:900;color:#e6edf780}.tile.selected{transform:scale(1.1);filter:brightness(1.42);outline:2px solid var(--gold);z-index:6}.tile.consume{animation:consume .32s}.trace{position:absolute;inset:14%;overflow:visible;z-index:5;pointer-events:none;filter:drop-shadow(0 0 6px #f3b634) drop-shadow(0 0 13px #f3b63499)}.fighter{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid #ffffffaa;box-shadow:0 10px 22px #000b;z-index:7;font-size:23px;transition:left .24s,top .24s,transform .2s}.fighter.enemy{left:calc(50% - 22px);top:4%;background:#a52b3e}.fighter.player{left:calc(50% - 22px);top:calc(100% - 48px);background:#1c9c6c}.fighter.hit{animation:hit .28s}.flash{position:absolute;inset:0;z-index:10;pointer-events:none}.flash.on{animation:flash .18s}.phase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0c1119df;border:1px solid #ffffff1c;border-radius:99px;padding:7px 12px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;z-index:8}.message{min-height:30px;padding:6px 4px 2px;text-align:center;font-size:13px;font-weight:900}.combo-box{min-height:54px;border-radius:18px;background:#0c1017df;border:1px solid #ffffff12;display:flex;align-items:center;gap:10px;padding:8px 10px}.combo-title{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:900}.combo{flex:1;overflow:hidden;white-space:nowrap;font-size:22px}.mult{font-size:21px;font-weight:900;color:var(--gold)}.tip{text-align:center;font-size:10px;color:var(--muted);padding:5px 0 7px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#05070bdd;backdrop-filter:blur(11px);z-index:30}.overlay.show{display:flex}.card{width:min(100%,380px);background:linear-gradient(160deg,#26303c,#12171e);border:1px solid #ffffff18;border-radius:28px;padding:25px;text-align:center}.big{font-size:60px}.card button{width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;background:linear-gradient(135deg,#dd9712,#ffc84f)}@keyframes hit{20%{transform:translateX(-8px) rotate(-6deg)}60%{transform:translateX(8px) rotate(5deg)}}@keyframes flash{50%{background:#ffffff88}}@keyframes consume{50%{transform:scale(.25);opacity:.12}}@media(max-height:720px){.arena{width:min(77vh,94vw)}.tip{display:none}}
</style></head><body><div class="app"><div class="header"><div class="logo">PROYECTO OCTÁGONO · ALPHA 0.1</div><div class="badge" id="round">R1 · TURNO 1</div></div><div class="hud enemy"><div><div class="name"><span>RICO “EL MURO”</span><span id="enemyHpText">100</span></div><div class="bar"><div class="fill" id="enemyHp"></div></div><div class="sub">Wrestler agresivo</div></div><div class="avatar">😠</div></div><div class="intent" id="intent"></div><div class="arena-wrap"><div class="arena"><div class="fighter enemy" id="enemyFighter">🥷</div><svg class="trace"><polyline id="traceLine" points="" fill="none" stroke="#f3b634" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="grid" id="grid"></div><div class="fighter player" id="playerFighter">🥊</div><div class="phase" id="phaseLabel">Distancia</div><div class="flash" id="flash"></div></div></div><div class="hud player"><div class="avatar">😤</div><div><div class="name"><span>TÚ · NOVATO</span><span id="playerHpText">100</span></div><div class="bar"><div class="fill" id="playerHp"></div></div><div class="bar energy"><div class="fill" id="energy"></div></div><div class="sub">Retrocede una casilla sin levantar el dedo</div></div></div><div class="message" id="message">Apoya el dedo y dibuja tu combo</div><div class="combo-box"><div class="combo-title">COMBO</div><div class="combo" id="combo">—</div><div class="mult" id="mult">x0</div></div><div class="tip">Desliza por casillas contiguas. Al levantar el dedo se ejecuta.</div></div><div class="overlay" id="overlay"><div class="card"><div class="big" id="resultEmoji">🏆</div><h1 id="resultTitle">Victoria</h1><p id="resultText"></p><button id="restart">Pelear otra vez</button></div></div><script>
const ACTIONS={distance:[['jab','🥊','Jab',4,4,30],['kick','🦵','Patada',7,7,22],['move','👣','Paso',1,2,18],['guard','🛡️','Guardia',0,2,17],['takedown','🤼','Derribo',10,11,9],['recover','❤️','Recuperar',0,-8,4]],ground:[['pound','👊','Golpe suelo',6,5,26],['control','🤼','Control',2,3,22],['submit','🔒','Sumisión',11,12,14],['guard','🛡️','Defensa',0,2,18],['escape','↗️','Escape',0,5,14],['recover','❤️','Recuperar',0,-7,6]]};
let phase='distance',tiles=[],selected=[],dragging=false,busy=false,playerHp=100,enemyHp=100,energy=100,turn=1,enemyIntent;const $=s=>document.querySelector(s),grid=$('#grid'),line=$('#traceLine');
function list(){return ACTIONS[phase].map(a=>({id:a[0],icon:a[1],name:a[2],damage:a[3],energy:a[4],w:a[5]}))}function pick(){let l=list(),t=l.reduce((s,a)=>s+a.w,0),r=Math.random()*t;for(const a of l){r-=a.w;if(r<=0)return a}return l[0]}
function build(repl=null){if(repl===null){grid.innerHTML='';tiles=[];selected=[]}for(const i of (repl??[...Array(25).keys()])){let a=pick();if(!tiles[i]){let el=document.createElement('div');el.className='tile';el.dataset.index=i;grid.appendChild(el);tiles[i]={el,a,index:i}}tiles[i].a=a;tiles[i].el.innerHTML=`<span>${a.icon}</span><small>${a.name}</small>`;tiles[i].el.classList.remove('consume','selected')}updateCombo();draw()}
function adj(a,b){let ar=Math.floor(a/5),ac=a%5,br=Math.floor(b/5),bc=b%5;return Math.abs(ar-br)<=1&&Math.abs(ac-bc)<=1&&a!==b}function clearSel(){selected.forEach(i=>tiles[i].el.classList.remove('selected'));selected=[];line.setAttribute('points','');updateCombo()}function start(i){if(busy)return;dragging=true;clearSel();add(i)}function add(i){if(!dragging||busy)return;let last=selected.at(-1),prev=selected.at(-2);if(i===prev){let rem=selected.pop();tiles[rem].el.classList.remove('selected');navigator.vibrate?.(5);updateCombo();draw();return}if(selected.includes(i))return;if(selected.length&&!adj(last,i))return;selected.push(i);tiles[i].el.classList.add('selected');navigator.vibrate?.(7);updateCombo();draw()}
function updateCombo(){$('#combo').textContent=selected.length?selected.map(i=>tiles[i].a.icon).join(' '):'—';$('#mult').textContent='x'+selected.length}function draw(){let gr=grid.getBoundingClientRect(),pts=selected.map(i=>{let r=tiles[i].el.getBoundingClientRect();return `${r.left-gr.left+r.width/2},${r.top-gr.top+r.height/2}`}).join(' ');line.setAttribute('points',pts)}function hitTile(e){let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');return el?+el.dataset.index:null}
grid.addEventListener('pointerdown',e=>{e.preventDefault();grid.setPointerCapture(e.pointerId);let i=hitTile(e);if(i!==null)start(i)});grid.addEventListener('pointermove',e=>{if(!dragging)return;let i=hitTile(e);if(i!==null)add(i)});grid.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;if(selected.length>=2)execute();else clearSel()});grid.addEventListener('pointercancel',()=>{dragging=false;clearSel()});
function intent(){let p=phase==='distance'?[['jab','🥊','Directo',7,'guard'],['kick','🦵','Low kick',10,'move'],['takedown','🤼','Derribo',13,'takedown']]:[['pound','👊','Ground and pound',11,'guard'],['submit','🔒','Intento de llave',15,'escape']];let x=p[Math.floor(Math.random()*p.length)];enemyIntent={type:x[0],icon:x[1],label:x[2],damage:x[3],counter:x[4]};$('#intent').innerHTML=`El rival prepara: <strong>${x[1]} ${x[2]}</strong>`}
function bars(){$('#enemyHp').style.width=enemyHp+'%';$('#enemyHpText').textContent=Math.ceil(enemyHp);$('#playerHp').style.width=playerHp+'%';$('#playerHpText').textContent=Math.ceil(playerHp);$('#energy').style.width=energy+'%';$('#round').textContent=`R1 · TURNO ${turn}`}function msg(t){$('#message').textContent=t}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function impact(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');$('#flash').classList.remove('on');void $('#flash').offsetWidth;$('#flash').classList.add('on')}
async function execute(){if(busy)return;busy=true;let used=[...selected],acts=used.map(i=>tiles[i].a),cost=Math.max(0,acts.reduce((s,a)=>s+a.energy,0));if(cost>energy){msg('No tienes energía suficiente');await wait(650);busy=false;clearSel();return}energy=Math.min(100,energy-cost+5);let damage=0,guard=0,moved=false,takedown=false,escaped=false;for(let n=0;n<acts.length;n++){let a=acts[n];msg(`${a.icon} ${a.name}`);if(a.id==='guard')guard+=8;else if(a.id==='move'||a.id==='escape'){moved=true;if(a.id==='escape')escaped=true}else if(a.id==='recover')energy=Math.min(100,energy+8);else{let bonus=1+n*.07;if(n&&acts[n-1].id==='jab'&&a.id==='kick')bonus+=.22;if(n&&acts[n-1].id==='move'&&a.id==='takedown')bonus+=.35;damage+=a.damage*bonus;impact($('#enemyFighter'));navigator.vibrate?.(a.id==='takedown'||a.id==='submit'?[25,25,60]:16)}if(a.id==='takedown')takedown=true;bars();await wait(165)}damage*=1+Math.max(0,acts.length-3)*.06;enemyHp=Math.max(0,enemyHp-damage);used.forEach(i=>tiles[i].el.classList.add('consume'));bars();msg(`Combo de ${acts.length} · ${Math.round(damage)} de daño`);await wait(500);if(enemyHp<=0){finish(true);return}if(takedown&&phase==='distance'){phase='ground';$('#phaseLabel').textContent='Suelo';msg('🤼 ¡Derribo! El combate cambia al suelo');await wait(650);build();intent()}else if(escaped&&phase==='ground'){phase='distance';$('#phaseLabel').textContent='Distancia';msg('↗️ Recuperas la distancia');await wait(650);build();intent()}await enemyTurn(guard,moved);if(playerHp<=0){finish(false);return}clearSel();build(used);energy=Math.min(100,energy+8);turn++;bars();intent();busy=false;msg('Tu turno. Dibuja el siguiente combo')}
async function enemyTurn(guard,moved){msg(`El rival ejecuta: ${enemyIntent.icon} ${enemyIntent.label}`);await wait(400);let dmg=enemyIntent.damage,ids=selected.map(i=>tiles[i].a.id);if(enemyIntent.counter==='guard'&&guard)dmg=Math.max(0,dmg-guard);if(enemyIntent.counter==='move'&&moved)dmg=Math.max(0,dmg-7);if(enemyIntent.counter==='takedown'&&ids.includes('takedown'))dmg=Math.max(0,dmg-10);if(enemyIntent.counter==='escape'&&ids.includes('escape'))dmg=Math.max(0,dmg-12);impact($('#playerFighter'));playerHp=Math.max(0,playerHp-dmg);navigator.vibrate?.([25,35,25]);bars();msg(dmg===0?'🛡️ ¡Contra perfecta!':`Recibes ${Math.round(dmg)} de daño`);await wait(500)}
function finish(win){busy=true;$('#overlay').classList.add('show');$('#resultEmoji').textContent=win?'🏆':'🥴';$('#resultTitle').textContent=win?'Victoria por KO':'Derrota';$('#resultText').textContent=win?`Has ganado en ${turn} turnos.`:'Lee el ataque rival y responde con la acción adecuada.'}function reset(){phase='distance';playerHp=enemyHp=energy=100;turn=1;busy=false;$('#phaseLabel').textContent='Distancia';$('#overlay').classList.remove('show');build();intent();bars();msg('Apoya el dedo y dibuja tu combo')}$('#restart').onclick=reset;build();intent();bars();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
