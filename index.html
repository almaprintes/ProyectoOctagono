<!doctype html><html lang='es'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{margin:0;background:#111;color:#fff;font-family:system-ui}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;touch-action:none}.c{background:#2b2b2b;height:70px;border-radius:12px;display:grid;place-items:center;font-size:30px}.sel{outline:3px solid gold}</style><h2 style='text-align:center'>Proyecto Octágono v0.2</h2><div id='state' style='text-align:center'>FASE 🥊 Distancia</div><div id='grid'></div><p id='combo' style='padding:10px'>Combo:-</p><button style='width:95%;margin:10px;height:48px' onclick='go()'>Ejecutar</button><script>
const dist=['🥊','🦵','👣','🛡️','❤️'],ground=['🤼','👊','🔒','🛡️','❤️'];let phase='dist',icons=dist;const g=document.getElementById('grid'),combo=document.getElementById('combo');let c=[],s=[];
function b(){g.innerHTML='';c=[];s=[];for(let i=0;i<25;i++){let d=document.createElement('div');d.className='c';d.dataset.i=i;d.textContent=icons[Math.floor(Math.random()*icons.length)];d.onpointerdown=e=>{s=[];document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));p(d)};d.onpointerenter=e=>{if(e.buttons)p(d)};g.appendChild(d);c.push(d)}combo.textContent='Combo:-'}
function a(x,y){let r1=(x/5)|0,c1=x%5,r2=(y/5)|0,c2=y%5;return Math.abs(r1-r2)<=1&&Math.abs(c1-c2)<=1}
function p(d){let i=+d.dataset.i;if(s.includes(i))return;if(s.length&&!a(s.at(-1),i))return;s.push(i);d.classList.add('sel');combo.textContent='Combo: '+s.map(i=>c[i].textContent).join(' ')}
function go(){if(s.length<2){alert('Haz un combo');return;}if(phase==='dist'&&s.map(i=>c[i].textContent).includes('🤼')){phase='ground';icons=ground;document.getElementById('state').textContent='FASE 🤼 Suelo';alert('¡Derribo! El tablero cambia al combate en el suelo.')}b()}
b();
</script>
